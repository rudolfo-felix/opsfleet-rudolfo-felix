[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-data-assistant"
version = "0.1.0"
description = "Enterprise Retail Data Analysis AI Assistant using LangGraph and Google Gemini"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Rudolfo Félix", email = "rudolfo@example.com" }
]
keywords = ["langgraph", "gemini", "bigquery", "retail-analytics", "agentic-ai"]

dependencies = [
    "langgraph>=0.2.20",
    "langchain-core>=0.3.0",
    "google-genai>=0.1.1",
    "google-cloud-bigquery>=3.25.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "db-dtypes>=1.2.0",
    "duckdb>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
